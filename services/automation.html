<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melih Gökmen | Automation</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/i18next@23.5.1/dist/umd/i18next.min.js"></script>
    <style>
        body {
            padding-top: 100px;
        }

        .content-area {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back-nav {
            margin-bottom: 30px;
        }

        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(12px);
        }

        h2 {
            color: var(--accent-primary);
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            margin-top: 30px;
        }

        li {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        li i {
            color: var(--accent-secondary);
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="../" class="logo">Melih.</a>
                <div class="lang-switcher">
                    <button id="lang-en" class="lang-btn">EN</button>
                    <span>/</span>
                    <button id="lang-tr" class="lang-btn">TR</button>
                </div>
            </nav>
        </div>
    </header>
    <div class="content-area">
        <div class="back-nav">
            <a href="../#services" style="color: var(--text-secondary);"><i class="fa-solid fa-arrow-left"></i> Back to
                Services</a>
        </div>
        <div class="detail-card">
            <div id="service-content">
                <h2 data-i18n="service.title">Automation & Workflow Specialist</h2>
                <p data-i18n="service.intro">Expert in optimizing processes through intelligent automation.</p>
                <ul>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list1"><strong>CI/CD:</strong> GitHub
                            Actions and Fastlane.</span></li>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list2"><strong>Scripting:</strong>
                            Python and Shell tools.</span></li>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list3"><strong>Testing:</strong>
                            Automated end-to-end testing.</span></li>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list4"><strong>Process:</strong>
                            Workflow streamlining.</span></li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resources = {
                en: {
                    translation: {
                        service: {
                            title: "Automation & Workflow Specialist",
                            intro: "Expert in optimizing development and business processes through intelligent automation. I focus on reducing manual tasks and increasing reliability.",
                            list1: "<strong>CI/CD:</strong> GitHub Actions, Bitrise, and Fastlane for mobile deployments.",
                            list2: "<strong>Scripting:</strong> Custom Python and Shell tools for data processing and bot development.",
                            list3: "<strong>Testing:</strong> Automated end-to-end testing strategies.",
                            list4: "<strong>Process:</strong> Workflow streamlining and developer experience (DevEx) improvements."
                        }
                    }
                },
                tr: {
                    translation: {
                        service: {
                            title: "Otomasyon ve İş Akışı Uzmanı",
                            intro: "Akıllı otomasyon yoluyla geliştirme ve iş süreçlerini optimize etme uzmanı. Manuel görevleri azaltmaya ve güvenilirliği artırmaya odaklanıyorum.",
                            list1: "<strong>CI/CD:</strong> Mobil dağıtımlar için GitHub Actions, Bitrise ve Fastlane.",
                            list2: "<strong>Betikleme:</strong> Veri işleme ve bot geliştirme için özel Python ve Shell araçları.",
                            list3: "<strong>Test:</strong> Otomatik uçtan uca (E2E) test stratejileri.",
                            list4: "<strong>Süreç:</strong> İş akışı basitleştirme ve geliştirici deneyimi (DevEx) iyileştirmeleri."
                        }
                    }
                }
            };

            if (typeof i18next !== 'undefined') {
                i18next.init({
                    resources,
                    lng: localStorage.getItem('lng') || 'en',
                    fallbackLng: 'en'
                }, () => {
                    update();
                });
            }

            function update() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.innerHTML = i18next.t(key);
                });
                const lng = i18next.language;
                document.getElementById('lang-en').classList.toggle('active', lng.startsWith('en'));
                document.getElementById('lang-tr').classList.toggle('active', lng.startsWith('tr'));
            }

            document.getElementById('lang-en').onclick = () => i18next.changeLanguage('en', () => { localStorage.setItem('lng', 'en'); update(); });
            document.getElementById('lang-tr').onclick = () => i18next.changeLanguage('tr', () => { localStorage.setItem('lng', 'tr'); update(); });
        });
    </script>
</body>

</html>
