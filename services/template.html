<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melih Gökmen | Service Details</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/i18next@23.5.1/dist/umd/i18next.min.js"></script>
    <style>
        body {
            padding-top: 100px;
        }

        .content-area {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back-nav {
            margin-bottom: 30px;
        }

        .detail-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(12px);
        }

        h2 {
            color: var(--accent-primary);
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            margin-top: 30px;
        }

        li {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        li i {
            color: var(--accent-secondary);
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a href="../" class="logo">Melih.</a>
                <div class="lang-switcher">
                    <button id="lang-en" class="lang-btn">EN</button>
                    <span>/</span>
                    <button id="lang-tr" class="lang-btn">TR</button>
                </div>
            </nav>
        </div>
    </header>
    <div class="content-area">
        <div class="back-nav">
            <a href="../#services" style="color: var(--text-secondary);"><i class="fa-solid fa-arrow-left"></i> Back to
                Services</a>
        </div>
        <div class="detail-card">
            <div id="service-content">
                <h2 data-i18n="service.title">SERVICE_TITLE</h2>
                <p data-i18n="service.intro">SERVICE_INTRO</p>
                <ul>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list1">LIST_ITEM_1</span></li>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list2">LIST_ITEM_2</span></li>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list3">LIST_ITEM_3</span></li>
                    <li><i class="fa-solid fa-check"></i> <span data-i18n="service.list4">LIST_ITEM_4</span></li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resources = {
                en: {
                    translation: {
                        service: {
                            title: "EN_TITLE",
                            intro: "EN_INTRO",
                            list1: "EN_LIST1",
                            list2: "EN_LIST2",
                            list3: "EN_LIST3",
                            list4: "EN_LIST4"
                        }
                    }
                },
                tr: {
                    translation: {
                        service: {
                            title: "TR_TITLE",
                            intro: "TR_INTRO",
                            list1: "TR_LIST1",
                            list2: "TR_LIST2",
                            list3: "TR_LIST3",
                            list4: "TR_LIST4"
                        }
                    }
                }
            };

            if (typeof i18next !== 'undefined') {
                i18next.init({
                    resources,
                    lng: localStorage.getItem('lng') || 'en',
                    fallbackLng: 'en'
                }, () => {
                    update();
                });
            } else {
                console.error('i18next not loaded');
            }

            function update() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    el.innerHTML = i18next.t(key);
                });
                const lng = i18next.language;
                document.getElementById('lang-en').classList.toggle('active', lng.startsWith('en'));
                document.getElementById('lang-tr').classList.toggle('active', lng.startsWith('tr'));
            }

            document.getElementById('lang-en').onclick = () => i18next.changeLanguage('en', () => { localStorage.setItem('lng', 'en'); update(); });
            document.getElementById('lang-tr').onclick = () => i18next.changeLanguage('tr', () => { localStorage.setItem('lng', 'tr'); update(); });
        });
    </script>
</body>

</html>
